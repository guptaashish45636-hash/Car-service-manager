<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Car Service Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-car-front-fill me-2"></i>Car Service Manager</a
        ><a href="index.html" class="btn btn-sm btn-outline-secondary"
          >Back to home</a
        >
      </div>
    </nav>
    <main class="auth-shell">
      <div class="container">
        <div class="auth-card mx-auto">
          <div class="text-center mb-4">
            <span class="icon-box mb-3"><i class="bi bi-person-lock"></i></span>
            <h1 class="h2">Welcome back</h1>
            <p class="text-secondary">Log in to manage your vehicles.</p>
          </div>
          <div id="formMessage"></div>
          <div class="card">
            <div class="card-body p-4 p-lg-5">
              <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label class="form-label">Email</label
                  ><input
                    name="email"
                    type="email"
                    class="form-control"
                    required
                  />
                  <div class="invalid-feedback">
                    Enter a valid email address.
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label
                  ><input
                    name="password"
                    type="password"
                    class="form-control"
                    minlength="6"
                    required
                  />
                  <div class="invalid-feedback">Enter your password.</div>
                </div>
                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  /><label class="form-check-label" for="remember"
                    >Remember Me</label
                  >
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  Login
                </button>
                <p class="text-center text-secondary small mt-4 mb-0">
                  Don't have an account? <a href="register.html">Register</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>

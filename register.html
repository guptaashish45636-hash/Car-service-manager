<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Car Service Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-car-front-fill me-2"></i>Car Service Manager</a
        ><a href="index.html" class="btn btn-sm btn-outline-secondary"
          >Back to home</a
        >
      </div>
    </nav>
    <main class="auth-shell">
      <div class="container">
        <div class="auth-card mx-auto">
          <div class="text-center mb-4">
            <span class="icon-box mb-3"><i class="bi bi-person-plus"></i></span>
            <h1 class="h2">Create your account</h1>
            <p class="text-secondary">
              Start keeping your car service records organized.
            </p>
          </div>
          <div id="formMessage"></div>
          <div class="card">
            <div class="card-body p-4 p-lg-5">
              <form id="registerForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label class="form-label">Full Name</label
                  ><input name="fullName" class="form-control" required />
                  <div class="invalid-feedback">Enter your full name.</div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label
                  ><input
                    name="email"
                    type="email"
                    class="form-control"
                    required
                  />
                  <div class="invalid-feedback">Enter a valid email.</div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Phone Number</label
                  ><input
                    name="phone"
                    type="tel"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label
                  ><input
                    name="password"
                    type="password"
                    class="form-control"
                    minlength="6"
                    required
                  />
                  <div class="invalid-feedback">Use at least 6 characters.</div>
                </div>
                <div class="mb-4">
                  <label class="form-label">Confirm Password</label
                  ><input
                    name="confirmPassword"
                    type="password"
                    class="form-control"
                    required
                  />
                  <div class="invalid-feedback">Passwords must match.</div>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  Create Account
                </button>
                <p class="text-center text-secondary small mt-4 mb-0">
                  Already have an account? <a href="login.html">Login</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
